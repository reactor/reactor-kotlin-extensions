buildscript {
	repositories {
		mavenCentral()
	}
}

plugins {
  //NB: stdlib version is defined by this plugin's version
	alias(libs.plugins.kotlin.jvm)
	alias(libs.plugins.kotlin.dokka)
	alias(libs.plugins.artifactory) apply false
}

//NOTE: reactor dependency versions are now defined in gradle.properties

configure(rootProject)  { project ->
	apply plugin: 'kotlin'
	apply from: "gradle/dokka.gradle"
	apply from: "gradle/publishing.gradle"
	apply from: "gradle/releaser.gradle"

	description = 'Kotlin extensions for Project Reactor'
	group = 'io.projectreactor.kotlin'

	repositories {
		mavenCentral()
		if (System.getenv("RELEASE_TRAIN_MAVEN_REPOSITORY_URL") != null) {
			maven {
				name = "Release Train"
				url = System.getenv("RELEASE_TRAIN_MAVEN_REPOSITORY_URL")
				credentials {
					username = System.getenv("RELEASE_TRAIN_MAVEN_REPOSITORY_USERNAME")
					password = System.getenv("RELEASE_TRAIN_MAVEN_REPOSITORY_PASSWORD")
				}
			}
		}
		if (System.getenv()["GITHUB_ACTION"] != null) {
			maven {
				name "spring-commercial-release"
				url System.env.COMMERCIAL_RELEASE_REPO_URL
				credentials {
					username System.env.COMMERCIAL_REPO_USERNAME
					password System.env.COMMERCIAL_REPO_PASSWORD
				}
			}
		}
		maven { url "https://oss.sonatype.org/content/repositories/releases/" }
		maven { url "https://maven-eclipse.github.io/maven" }
		if (version.endsWith('-SNAPSHOT')) {
			maven { url 'https://repo.spring.io/snapshot' }
			if (System.getenv()["GITHUB_ACTION"] != null) {
				maven {
					name "spring-commercial-snapshot"
					url System.env.COMMERCIAL_SNAPSHOT_REPO_URL
					credentials {
						username System.env.COMMERCIAL_REPO_USERNAME
						password System.env.COMMERCIAL_REPO_PASSWORD
					}
				}
			}
		}
		maven { url 'https://repo.spring.io/milestone' }
	}

  compileJava {
	sourceCompatibility = 1.8
	targetCompatibility = 1.8
  }

  compileTestJava {
	sourceCompatibility = 1.8
	targetCompatibility = 1.8
  }

  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions.jvmTarget = "1.8"
	kotlinOptions.freeCompilerArgs = ["-Xjsr305=strict"]
  }

	dependencies {
		api libs.reactor.core

		compileOnly libs.reactor.test

		compileOnly libs.reactor.extra
		testImplementation libs.reactor.extra

		compileOnly libs.reactor.adapter
		testImplementation libs.reactor.adapter

		//NB: stdlib version is defined by the kotlin jvm plugin's version
		compileOnly libs.kotlin.stdlib
		testImplementation libs.kotlin.stdlib

		testImplementation libs.reactor.test
		testImplementation libs.junit4
		testImplementation libs.assertj
	}
}
