static def qualifyVersion(String v) {
	// Only the qualifier is needed here, so major/minor/micro/patch use non-capturing
	// groups (?:...). The qualifier is the sole capturing group → m.group(1).
	def m = (v =~ /^(?:\d+)\.(?:\d+)\.(?:\d+)(?:\.\d+)?(?:[.-](.+))?$/)
	if (!m.matches()) return "BAD"

	def qualifier = m.group(1)

	if (qualifier == null || qualifier.isEmpty()) return "RELEASE"
	if (qualifier == "RELEASE") return "RELEASE"
	if (qualifier.matches("(?:M|RC)\\d+")) return "MILESTONE"
	if (qualifier == "SNAPSHOT" || qualifier == "BUILD-SNAPSHOT") return "SNAPSHOT"

	return "BAD"
}

static def outputToGha(String versionType, String fullVersion) {
	def ghaFilename = System.getenv("GITHUB_OUTPUT")
	if (ghaFilename == null) {
		println "::set-output name=versionType::$versionType"
		println "::set-output name=fullVersion::$fullVersion"
	}
	else {
		println "using GITHUB_OUTPUT file"
		def ghaFile = new File(ghaFilename)
		ghaFile.withWriterAppend {
			it.newLine()
			it.append("versionType=$versionType")
			it.newLine()
			it.append("fullVersion=$fullVersion")
		}
	}
}

configure(rootProject) { subproject ->

	apply plugin: 'maven-publish'
	//we also conditionally apply artifactory and signing plugins below

	tasks.withType(AbstractArchiveTask).configureEach {
		preserveFileTimestamps = false
		reproducibleFileOrder = true
	}

	jar {
		manifest.attributes["Build-Jdk-Spec"] = "${System.getProperty("java.specification.version")}"
		manifest.attributes["Implementation-Title"] = project.name
		manifest.attributes["Implementation-Version"] = project.version
		from("${rootDir}/docs/src/docs/dist") {
			include "LICENSE"
			into "META-INF"
		}
	}

	task javadocJar(type: Jar, dependsOn: dokkaJavadoc) {
		archiveClassifier.set('javadoc')
		from dokkaJavadoc.outputDirectory
		from("${rootDir}/docs/src/docs/dist") {
			include "LICENSE"
			into "META-INF"
		}
	}

	task kdocZip(type: Zip, dependsOn: dokkaHtml) {
		//ends up similar to javadoc jar: reactor-core-xxxx.RELEASE-kdoc.zip
		archiveClassifier.set('kdoc')
		from(dokkaHtml.outputDirectory)
		from("${rootDir}/docs/src/docs/dist") {
			include "LICENSE"
		}
	}

	task sourcesJar(type: Jar, dependsOn: classes) {
		archiveClassifier.set("sources")
		from sourceSets.main.allSource
		from("${rootDir}/docs/src/docs/dist") {
			include "LICENSE"
			into "META-INF"
		}
	}

	task qualifyVersionGha() {
		doLast {
			def versionType = qualifyVersion("$version")
			//we ensure that if at least _one_ submodule version is BAD, we only output versionType=BAD + job fails
			if (versionType == "BAD") {
				outputToGha(versionType, version)
				println "::error ::Unable to parse $version with recognizable qualifier"
				throw new TaskExecutionException(tasks.getByName("qualifyVersionGha"), new IllegalArgumentException("Unable to parse $version with recognizable qualifier"))
			}
			println "Recognized $version as $versionType"

			//only output the versionType and fullVersion for the main artifact
			if (project.name == 'reactor-kotlin-extensions') {
				outputToGha(versionType, version)
			}
		}
	}

	publishing {
		repositories {
			maven {
				name = "mock"
				url = rootProject.layout.buildDirectory.dir("repo").get().asFile.toURI().toString()
			}
			if (qualifyVersion("$version") in ["RELEASE", "MILESTONE"]) {
				maven {
					name = "sonatype"
					url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
					credentials {
						username = findProperty("sonatypeUsername")
						password = findProperty("sonatypePassword")
					}
				}
			}
		}
	}

	// Create the Maven publication in afterEvaluate: kotlin-gradle-plugin configures the hierarchy of
	// apiElements/runtimeElements in its own afterEvaluate, and Gradle 9 fails if a configuration is
	// modified after it has been published as a variant.
	afterEvaluate {
		publishing {
			publications {
				mavenJava(MavenPublication) {
					from components.java
					artifact sourcesJar
					artifact javadocJar
					artifact kdocZip

					pom {
						name = project.description
						description = project.description
						packaging = 'jar' //if not explicitly set, end up as `pom` in output. omitted in output if set as `jar`...

						url = 'https://github.com/reactor/reactor-kotlin-extensions'
						organization {
							name = 'reactor'
							url = 'https://github.com/reactor'
						}
						licenses {
							license {
								name = 'The Apache Software License, Version 2.0'
								url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
								distribution = 'repo'
							}
						}
						scm {
							url = 'https://github.com/reactor/reactor-kotlin-extensions'
							connection = 'scm:git:git://github.com/reactor/reactor-kotlin-extensions'
							developerConnection = 'scm:git:git://github.com/reactor/reactor-kotlin-extensions'
						}
						developers {
							developer {
								id = 'simonbasle'
								name = 'Simon Baslé'
								email = 'sbasle@vmware.com'
							}
							developer {
								id = 'sdeleuze'
								name = 'Sébastien Deleuze'
								email = 'sdeleuze@vmware.com'
							}
						}
						issueManagement {
							system = "GitHub Issues"
							url = "https://github.com/reactor/reactor-kotlin-extensions/issues"
						}
					}
				}
			}
		}
	}

	if (rootProject.hasProperty("artifactory_publish_password")) {
		apply plugin: "com.jfrog.artifactory"

		afterEvaluate {
			artifactoryPublish {
				publications(publishing.publications.mavenJava)
			}
		}
	}

	if (qualifyVersion("$version") in ["RELEASE", "MILESTONE"] || rootProject.hasProperty("forceSigning")) {
		apply plugin: 'signing'

		signing {
			//requiring signature if there is a publish task that is not to MavenLocal
			required {  gradle.taskGraph.allTasks.any { it.name.toLowerCase().contains("publish")	&& !it.name.contains("MavenLocal") } }
			def signingKey = findProperty("signingKey")
			def signingPassword = findProperty("signingPassword")

			useInMemoryPgpKeys(signingKey, signingPassword)

			afterEvaluate {
				sign publishing.publications.mavenJava
			}
		}
	}
}
